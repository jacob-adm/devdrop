# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devdrop"
version = "0.3.4"
description = "Install one mobile build on every attached Android and iOS device."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["android", "ios", "mobile", "adb", "devicectl", "simctl", "deploy", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/jacob-adm/devdrop"
Documentation = "https://github.com/jacob-adm/devdrop/tree/main/docs"
Source = "https://github.com/jacob-adm/devdrop"
Issues = "https://github.com/jacob-adm/devdrop/issues"

[project.scripts]
devdrop = "devdrop.cli:main"

[tool.setuptools]
packages = ["devdrop"]

# Development only: `python -m coverage run -m unittest discover -s tests`
# then `python -m coverage report`. Child processes are measured too.
[tool.coverage.run]
branch = true
source = ["devdrop"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
